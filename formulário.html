<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Formulário</title>
</head>
<body>
    <form id="meuFormulário" action="https://webhook.site/36975d71-b182-4563-af3e-7b74cb5a0676" method="post">
        <label for="nome">Nome:</label>
        <input
         type="text" 
         id="nome" 
         name="nome" 
         placeholder="Digite seu nome"
         required
         >


        <label for="email">E-mail:</label>
        <input 
        type="email" 
        id="email"
        name="email"
        placeholder="e-mail@exemplo.com"
        required
        >

        <label for="senha">Senha:</label>
        <input 
        type="password" 
        id="senha"
        name="senha"
        placeholder="Digite sua senha"
        minlength="8"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@&!%*?&])[A-Za-z\d@&!%*?&]{8,}"
        required
        >
        <label for="Idade">Idade:</label>
        <input 
        type="number" 
        id="idade" 
        name="idade" 
        min="0" 
        max="120" 
        step="1"
        value="14"
        required
        placeholder="Digite"
        >

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
